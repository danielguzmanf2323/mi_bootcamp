# bronze_config.yml
# Configuración de la pipeline de ingesta Bronze
# Inetum Data Engineer Bootcamp — Semana 04
#
# IMPORTANTE: No edites este archivo directamente.
# Copia este archivo a tu carpeta de trabajo:
#   semana_04/actividades/actividad_03/<tu_nombre>/bronze_config_<tu_nombre>.yml
#
# En tu copia, sufija tu nombre en cada campo "table:" para no pisar tablas de otros:
#   table: transactions_<tu_nombre>
#   table: users_<tu_nombre>
#   ...etc
#
# Este archivo es la referencia de producción — es de solo lectura para el ejercicio.

pipeline:
  name: financial_transactions_bronze
  catalog: main              # Unity Catalog: catalog.schema.table
  environment: dev           # dev | prod — se sobreescribe con widget al ejecutar

sources:

  - name: transactions
    description: "Transacciones financieras principales"
    source_path: "/Volumes/main/landing/raw/transactions_data.csv"
    format: csv
    options:
      header: "true"
      inferSchema: "true"
    destination:
      schema: bronze
      table: transactions
      write_mode: overwrite

  - name: users
    description: "Datos demográficos de usuarios"
    source_path: "/Volumes/main/landing/raw/users_data.csv"
    format: csv
    options:
      header: "true"
      inferSchema: "true"
    destination:
      schema: bronze
      table: users
      write_mode: overwrite

  - name: cards
    description: "Metadatos de tarjetas de crédito/débito"
    source_path: "/Volumes/main/landing/raw/cards_data.csv"
    format: csv
    options:
      header: "true"
      inferSchema: "true"
    destination:
      schema: bronze
      table: cards
      write_mode: overwrite

  - name: mcc_codes
    description: "Categorías de comercios (MCC codes)"
    source_path: "/Volumes/main/landing/raw/mcc_codes.json"
    format: json
    options:
      multiLine: "true"
    destination:
      schema: bronze
      table: mcc_codes
      write_mode: overwrite

  - name: fraud_labels
    description: "Etiquetas de fraude por transacción"
    source_path: "/Volumes/main/landing/raw/train_fraud_labels.json"
    format: json
    options:
      multiLine: "true"
    destination:
      schema: bronze
      table: fraud_labels
      write_mode: overwrite
